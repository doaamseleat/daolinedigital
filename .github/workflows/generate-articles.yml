name: Generate Articles JSON

on:
  push:
    paths:
      - 'blog/*.html'
      - '.github/workflows/generate-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Generate articles.json
        run: |
          python3 << 'PY'
          import re, json
          from pathlib import Path

          blog_dir = Path("blog")
          articles = []

          for file in blog_dir.glob("*.html"):
              if file.name == "index.html":
                  continue
              if file.is_dir():
                  continue

              text = file.read_text(encoding="utf-8", errors="ignore")

              title_match = re.search(r"<title>(.*?)</title>", text, re.S | re.I)
              desc_match = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', text, re.S | re.I)

              title = title_match.group(1).strip() if title_match else file.stem
              desc = desc_match.group(1).strip() if desc_match else "مقال من Daoline Digital."

              # نستخدم تاريخ التعديل بدل الرقم - الاحدث يطلع الاول
              mtime = file.stat().st_mtime

              nums = re.findall(r"\d+", file.name)
              number = int(nums[0]) if nums else 0

              articles.append({
                  "title": title,
                  "desc": desc,
                  "link": file.name,
                  "number": number,
                  "mtime": mtime
              })

          # الترتيب بتاريخ التعديل - الاحدث اولاً
          articles.sort(key=lambda x: x["mtime"], reverse=True)

          # نشيل حقل mtime قبل الحفظ عشان نحافظ على شكل الملف القديم
          for a in articles:
              a.pop("mtime", None)

          out = blog_dir / "articles.json"
          out.write_text(json.dumps(articles, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"Generated {len(articles)} articles sorted by newest first")
          PY

      - name: Commit articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/articles.json
          git commit -m "Auto update articles.json - sorted by date" || echo "No changes"
          git push
