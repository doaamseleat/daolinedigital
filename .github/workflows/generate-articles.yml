name: Generate Articles JSON

on:
  push:
    paths:
      - 'blog/*.html'
      - '.github/workflows/generate-articles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Generate articles.json by real publish date
        run: |
          python3 << 'PY'
          import re, json, subprocess
          from pathlib import Path

          blog_dir = Path("blog")
          articles = []

          def get_git_date(file_path):
              try:
                  # تاريخ آخر تعديل للملف في الـ git = تاريخ النشر
                  ts = subprocess.check_output(
                      ["git", "log", "-1", "--format=%at", "--", str(file_path)],
                      text=True
                  ).strip()
                  return int(ts) if ts else 0
              except:
                  try:
                      return int(file_path.stat().st_mtime)
                  except:
                      return 0

          for file in blog_dir.glob("*.html"):
              if file.name == "index.html":
                  continue
              if file.is_dir():
                  continue

              try:
                  text = file.read_text(encoding="utf-8", errors="ignore")
              except:
                  continue

              title_match = re.search(r"<title>(.*?)</title>", text, re.S | re.I)
              desc_match = re.search(r'<meta\s+name=["\']description["\']\s+content=["\'](.*?)["\']', text, re.S | re.I)

              title = title_match.group(1).strip() if title_match else file.stem
              desc = desc_match.group(1).strip() if desc_match else "مقال من Daoline Digital."

              publish_date = get_git_date(file)

              nums = re.findall(r"\d+", file.name)
              number = int(nums[0]) if nums else 0

              articles.append({
                  "title": title,
                  "desc": desc,
                  "link": file.name,
                  "number": number,
                  "_publish_date": publish_date
              })

          # الأحدث أولاً حسب تاريخ النشر الحقيقي
          articles.sort(key=lambda x: x["_publish_date"], reverse=True)

          for a in articles:
              a.pop("_publish_date", None)

          out = blog_dir / "articles.json"
          out.write_text(json.dumps(articles, ensure_ascii=False, indent=2), encoding="utf-8")
          print(f"✅ Generated {len(articles)} articles sorted by REAL publish date")
          PY

      - name: Commit articles.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blog/articles.json
          git commit -m "Fix: sort by real git publish date" || echo "No changes"
          git push
