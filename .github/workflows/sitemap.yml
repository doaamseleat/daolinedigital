name: Auto-generate sitemap.xml

on:
  push:
    branches:
      - main
    paths:
      - "*.html"
      - "blog/*.html"
      - ".github/workflows/sitemap.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate sitemap
        run: |
          python3 << 'PY'
          from pathlib import Path
          from urllib.parse import quote
          from datetime import datetime

          BASE = "https://daolinedigital.com"

          urls = [
              ("/", "weekly", "1.0"),
              ("/blog/", "daily", "0.9"),
              ("/contact.html", "yearly", "0.4"),
              ("/privacy.html", "yearly", "0.3"),
              ("/terms.html", "yearly", "0.3"),
          ]

          blog_dir = Path("blog")

          for file in sorted(blog_dir.glob("*.html")):
              if file.name == "index.html":
                  continue

              encoded_path = "/blog/" + quote(file.name)
              urls.append((encoded_path, "monthly", "0.8"))

          today = datetime.utcnow().date().isoformat()

          sitemap = ['<?xml version="1.0" encoding="UTF-8"?>']
          sitemap.append('<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">')

          for path, changefreq, priority in urls:
              sitemap.append("  <url>")
              sitemap.append(f"    <loc>{BASE}{path}</loc>")
              sitemap.append(f"    <lastmod>{today}</lastmod>")
              sitemap.append(f"    <changefreq>{changefreq}</changefreq>")
              sitemap.append(f"    <priority>{priority}</priority>")
              sitemap.append("  </url>")

          sitemap.append("</urlset>")

          Path("sitemap.xml").write_text("\n".join(sitemap), encoding="utf-8")
          PY

      - name: Commit sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sitemap.xml

          if git diff --cached --quiet; then
            echo "No sitemap changes"
            exit 0
          fi

          git commit -m "Auto update sitemap.xml"

          git pull --rebase origin main
          git push origin main
