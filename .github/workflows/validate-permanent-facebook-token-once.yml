name: Validate permanent Facebook token once
on:
  push:
    paths:
      - '.github/workflows/validate-permanent-facebook-token-once.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate identity and read access
        env:
          FB_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
        run: |
          mkdir -p .github/token-check
          curl --silent --show-error --get "https://graph.facebook.com/v26.0/627701733973210" \
            --data-urlencode "fields=id,name" \
            --data-urlencode "access_token=$FB_TOKEN" \
            -o .github/token-check/identity.json
          curl --silent --show-error --get "https://graph.facebook.com/v26.0/627701733973210/posts" \
            --data-urlencode "fields=id,created_time" \
            --data-urlencode "limit=1" \
            --data-urlencode "access_token=$FB_TOKEN" \
            -o .github/token-check/read.json
      - name: Save sanitized results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/token-check
          git commit -m "Temporary permanent token validation"
          git push
