name: Publish 2 Articles Per Day - Daoline
on:
  schedule:
    - cron: '0 9 * * *'   # 12 الظهر بتوقيت مصر (UTC+3)
    - cron: '0 18 * * *'  # 9 بالليل بتوقيت مصر (UTC+3)
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish from queue OR recycle old
        id: publish
        run: |
          QUEUE_FILE=$(ls -1 blog/queue/*.html 2>/dev/null | grep -v ".gitkeep" | head -n 1)
          if [ -n "$QUEUE_FILE" ]; then
            BASENAME=$(basename "$QUEUE_FILE")
            mv "$QUEUE_FILE" "blog/$BASENAME"
            echo "BASENAME=$BASENAME" >> $GITHUB_ENV
            echo "mode=new" >> $GITHUB_ENV
            echo "published=true" >> $GITHUB_OUTPUT
          else
            LAST_FILE=".github/last_published.txt"
            LAST=$(cat $LAST_FILE 2>/dev/null || echo "0")
            FILES=($(ls -1 blog/*.html | sort))
            if [ ${#FILES[@]} -eq 0 ]; then
              echo "No files in blog/"
              echo "published=false" >> $GITHUB_OUTPUT
              exit 0
            fi
            NEXT=$(( (LAST + 1) % ${#FILES[@]} ))
            BASENAME=$(basename "${FILES[$NEXT]}")
            echo "$NEXT" > $LAST_FILE
            echo "BASENAME=$BASENAME" >> $GITHUB_ENV
            echo "mode=recycle" >> $GITHUB_ENV
            echo "published=true" >> $GITHUB_OUTPUT
            git add $LAST_FILE
          fi
          
          git config user.name "Daoline Bot"
          git config user.email "bot@daolinedigital.com"
          git add .
          git commit -m "Auto publish: $BASENAME - $mode" || echo "no changes"
          git push

      - name: Post to Facebook Page DaoLine
        if: steps.publish.outputs.published == 'true'
        env:
          FB_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PAGE_ID: "627701733973210"
        run: |
          FILE="blog/${{ env.BASENAME }}"
          TITLE=$(grep -oPm1 "(?<=<title>).*?(?=</title>)" "$FILE" | head -n1)
          if [ -z "$TITLE" ]; then
            TITLE="${{ env.BASENAME }}"
          fi
          LINK="https://daolinedigital.com/blog/${{ env.BASENAME }}"
          
          if [ "${{ env.mode }}" = "new" ]; then
            PREFIX="🚀 مقال جديد من Daoline"
          else
            PREFIX="📚 من أرشيف Daoline - اقرأ مرة أخرى"
          fi
          
          echo "Posting $FILE with mode ${{ env.mode }}"
          
          RESPONSE=$(curl -s -X POST "https://graph.facebook.com/v19.0/${{ env.PAGE_ID }}/feed" \
            --data-urlencode "message=$PREFIX: $TITLE

          اقرأ المقال كامل هنا: $LINK

          #تسويق_الكتروني #DaolineDigital #تسويق" \
            --data-urlencode "link=$LINK" \
            -d "access_token=$FB_TOKEN")
          
          echo "Facebook Response: $RESPONSE"
          
          if echo "$RESPONSE" | grep -q '"error"'; then
            echo "❌ FAILED TO POST TO FACEBOOK"
            echo "$RESPONSE"
            exit 1
          else
            echo "✅ SUCCESS POSTED: $RESPONSE"
          fi
