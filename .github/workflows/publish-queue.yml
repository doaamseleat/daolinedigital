name: Publish 2 Articles Per Day - Daoline

on:
  schedule:
    - cron: '0 9 * * *'   # 12:00 PM Egypt during UTC+3
    - cron: '0 18 * * *'  # 9:00 PM Egypt during UTC+3
  workflow_dispatch:
    inputs:
      article:
        description: "Optional article path for a manual test, e.g. blog/018.html"
        required: false
        type: string
      dry_run:
        description: "Generate and validate the poster without publishing to Facebook"
        required: false
        default: true
        type: boolean

concurrency:
  group: publish-daoline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install poster generator
        run: npm ci

      - name: Select article without advancing queue
        id: prepare
        env:
          MANUAL_ARTICLE: ${{ inputs.article }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          git pull --rebase origin main || true

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$DRY_RUN" = "true" ] && [ -z "$MANUAL_ARTICLE" ]; then
            echo "A dry run requires an article path, for example blog/018.html"
            exit 1
          fi

          PUBLISHED_RUNS=".github/facebook-published-runs.log"
          EXISTING=$(grep -F "${GITHUB_RUN_ID}|" "$PUBLISHED_RUNS" 2>/dev/null | tail -n 1 || true)
          if [ -n "$EXISTING" ]; then
            echo "This workflow run was already published: $EXISTING"
            echo "already_published=true" >> "$GITHUB_ENV"
            echo "selected=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "already_published=false" >> "$GITHUB_ENV"

          if [ -n "$MANUAL_ARTICLE" ]; then
            if [ ! -f "$MANUAL_ARTICLE" ] || [[ "$MANUAL_ARTICLE" != blog/*.html ]]; then
              echo "Invalid manual article path: $MANUAL_ARTICLE"
              exit 1
            fi
            ARTICLE_PATH="$MANUAL_ARTICLE"
            BASENAME=$(basename "$MANUAL_ARTICLE")
            MODE="test"
            NEXT_INDEX=""
          else
            QUEUE_FILE=$(find blog/queue -maxdepth 1 -type f -name '*.html' -print 2>/dev/null | sort | head -n 1 || true)
            if [ -n "$QUEUE_FILE" ]; then
              echo "Found new file in queue: $QUEUE_FILE"
              ARTICLE_PATH="$QUEUE_FILE"
              BASENAME=$(basename "$QUEUE_FILE")
              MODE="new"
              NEXT_INDEX=""
            else
              echo "Queue empty - selecting an archived article"
              LAST_FILE=".github/last_published.txt"
              LAST=$(cat "$LAST_FILE" 2>/dev/null || echo "-1")
              mapfile -t FILES < <(find blog -maxdepth 1 -type f -name '*.html' -print | sort)

              if [ ${#FILES[@]} -eq 0 ]; then
                echo "No files in blog/ to recycle"
                echo "selected=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              NEXT_INDEX=$(( (LAST + 1) % ${#FILES[@]} ))
              ARTICLE_PATH="${FILES[$NEXT_INDEX]}"
              BASENAME=$(basename "$ARTICLE_PATH")
              MODE="recycle"
            fi
          fi

          echo "ARTICLE_PATH=$ARTICLE_PATH" >> "$GITHUB_ENV"
          echo "BASENAME=$BASENAME" >> "$GITHUB_ENV"
          echo "mode=$MODE" >> "$GITHUB_ENV"
          echo "NEXT_INDEX=$NEXT_INDEX" >> "$GITHUB_ENV"
          echo "selected=true" >> "$GITHUB_OUTPUT"

      - name: Generate and validate Daoline Facebook poster
        if: steps.prepare.outputs.selected == 'true'
        run: |
          set -euo pipefail
          node scripts/generate-facebook-poster.mjs \
            --article "${{ env.ARTICLE_PATH }}" \
            --logo "logo-daoline.png" \
            --output "tmp/facebook-poster.png"
          node scripts/test-facebook-poster.mjs

      - name: Post poster to Facebook Page DaoLine
        if: steps.prepare.outputs.selected == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          FB_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          PAGE_ID: "627701733973210"
        run: |
          set -euo pipefail

          # FB_TOKEN is the non-expiring System User token. Resolve a Page token
          # at runtime because New Pages Experience requires a Page token for /posts and /photos.
          TOKEN_RESPONSE=$(curl --silent --show-error --get \
            "https://graph.facebook.com/v26.0/$PAGE_ID" \
            --data-urlencode "fields=access_token" \
            --data-urlencode "access_token=$FB_TOKEN")
          if echo "$TOKEN_RESPONSE" | grep -q '"error"'; then
            echo "$TOKEN_RESPONSE"
            echo "::error::Could not resolve a Page access token from the System User token"
            exit 1
          fi
          PAGE_TOKEN=$(printf '%s' "$TOKEN_RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s); console.log(r.access_token || '')})")
          if [ -z "$PAGE_TOKEN" ]; then
            echo "::error::Meta returned no Page access token"
            exit 1
          fi

          META=$(node scripts/generate-facebook-poster.mjs --article "$ARTICLE_PATH" --logo logo-daoline.png --output tmp/facebook-poster.png)
          TITLE=$(printf '%s' "$META" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).title))")
          DESCRIPTION=$(printf '%s' "$META" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.parse(s).description))")
          LINK="https://daolinedigital.com/blog/$BASENAME"

          if [ "$mode" = "new" ]; then
            PREFIX="🚀 مقال جديد من Daoline"
          elif [ "$mode" = "test" ]; then
            PREFIX="🧪 اختبار نشر Daoline"
          else
            PREFIX="📚 من أرشيف Daoline"
          fi

          CAPTION="$PREFIX

          $TITLE

          $DESCRIPTION

          اقرأ المقال كاملًا هنا:
          $LINK

          #تسويق_رقمي #DaolineDigital"

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl --silent --show-error \
            --output "$RESPONSE_FILE" --write-out "%{http_code}" \
            -X POST "https://graph.facebook.com/v26.0/$PAGE_ID/photos" \
            -F "source=@tmp/facebook-poster.png;type=image/png" \
            -F "caption=$CAPTION" \
            -F "published=true" \
            -F "access_token=$PAGE_TOKEN")
          RESPONSE=$(cat "$RESPONSE_FILE")
          echo "Facebook Response: $RESPONSE"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ] || echo "$RESPONSE" | grep -q '"error"'; then
            echo "::error::Facebook photo post failed (HTTP $HTTP_CODE)"
            exit 1
          fi

          POST_ID=$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const r=JSON.parse(s); console.log(r.post_id || r.id || '')})")
          if [ -z "$POST_ID" ]; then
            echo "::error::Facebook returned success without a post ID"
            exit 1
          fi
          echo "FB_POST_ID=$POST_ID" >> "$GITHUB_ENV"
          echo "Successfully posted to Facebook: $POST_ID"

      - name: Finalize queue only after Facebook success
        if: steps.prepare.outputs.selected == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          set -euo pipefail
          mkdir -p .github
          PUBLISHED_RUNS=".github/facebook-published-runs.log"

          if grep -Fq "${GITHUB_RUN_ID}|" "$PUBLISHED_RUNS" 2>/dev/null; then
            echo "Publish already finalized for this workflow run."
            exit 0
          fi

          if [ "$mode" = "new" ]; then
            mv "$ARTICLE_PATH" "blog/$BASENAME"
          elif [ "$mode" = "recycle" ]; then
            echo "$NEXT_INDEX" > ".github/last_published.txt"
          fi

          printf '%s|%s|%s|%s|%s\n' \
            "$GITHUB_RUN_ID" "$BASENAME" "$mode" "$FB_POST_ID" "$(date -u +%FT%TZ)" \
            >> "$PUBLISHED_RUNS"

          git config user.name "Daoline Bot"
          git config user.email "bot@daolinedigital.com"
          git add .
          git commit -m "Record Facebook publish: $BASENAME - $FB_POST_ID" || true
          git push origin main || (git pull --rebase origin main && git push origin main)

      - name: Upload generated poster artifact
        if: always() && steps.prepare.outputs.selected == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: daoline-facebook-poster-${{ env.BASENAME }}
          path: tmp/facebook-poster.png
          if-no-files-found: warn
          retention-days: 7
