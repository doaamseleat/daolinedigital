<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Ḥaa ح — Hear the letter</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@700&family=Nunito:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/ar/style.css"></head><body><div class="top">Letter 6 of 28</div><div class="card">
<div class="big ar">ح</div><div class="name">Ḥaa <span class="ar">حَاء</span></div>
<div class="word"><span class="w ar">حِصَان</span><span class="m">horse</span></div><img src="/ar/img/06.png" alt="horse">
<button class="play" id="p">▶ Listen</button>
<div class="row"><button data-s="0"><span class="ar">حَاء</span>Name</button><button data-s="1"><span class="ar">حَ</span>Sound</button><button data-s="2"><span class="ar">حِصَان</span>Word</button></div>
<div class="sent"><div class="sa ar">الحِصَانُ يَجْرِي.</div><div class="se">The horse runs.</div><button class="play s2" id="ps">▶ Sentence</button></div></div>
<nav><a href="/ar/5/">← Jeem</a><a href="/ar/">All</a><a href="/ar/7/">Khaa →</a></nav><script>
const T=["حَاء", "حَ", "حِصَان"], N='06', PARTS=[[0.45, 1.3], [1.5, 2.07], [2.42, 3.55]];
let ctx=null,cur=null;const bufs={};
function speak(txt){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='ar-SA';u.rate=.7;const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('ar'));if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}
async function load(name){if(bufs[name])return bufs[name];
 for(const ext of ['.mp3','.wav']){try{const r=await fetch('/ar/audio/'+name+ext);if(!r.ok)continue;const ab=await r.arrayBuffer();bufs[name]=await ctx.decodeAudioData(ab);return bufs[name]}catch(e){}}
 throw new Error('no audio')}
async function play(name,st,en,fallback){
 try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')await ctx.resume();
  const b=await load(name);if(cur){try{cur.stop()}catch(e){}}
  const src=ctx.createBufferSource();src.buffer=b;src.connect(ctx.destination);
  st=st||0;en=en||b.duration;src.start(0,st,Math.max(.05,en-st));cur=src}
 catch(e){speak(fallback)}}
document.getElementById('p').onclick=()=>play(N,0,0,T.join(' ، '));
document.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{const k=+b.dataset.s;play(N,PARTS[k][0],PARTS[k][1],T[k])});
document.getElementById('ps').onclick=()=>play('s'+N,0,0,document.querySelector('.sa').textContent);
</script><footer>Daoline Books · Arabic Alphabet Workbook</footer></body></html>
