<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تقرير السعادة العالمي 2026: السوشيال ميديا بتأذي مين بالظبط؟ | Daoline Digital</title>
  <meta name="description" content="جامعة Oxford نشرت أكبر دراسة عالمية عن السوشيال ميديا والصحة النفسية. النتايج صادمة — وفيها فرصة كبيرة للكريتور العربي.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #c013a6; --bg: #020617; --surface: #0f172a; --text: #ecf1f8; --muted: #a8b8cc; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); line-height: 2.1; overflow-x: hidden; }
    header { position: sticky; top: 0; z-index: 1000; background: rgba(15,23,42,0.96); backdrop-filter: blur(12px); border-bottom: 2px solid var(--primary); padding: 15px 20px; }
    .nav { max-width: 1100px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
    .nav a { color: #fff; text-decoration: none; font-weight: 700; font-size: 0.95rem; margin-left: 20px; transition: 0.3s; }
    .nav a:hover { color: var(--primary); }
    .logo { font-size: 1.4rem; font-weight: 900; color: #fff; text-decoration: none; }
    .logo span { color: var(--primary); }
    .container { max-width: 900px; margin: 40px auto; padding: 0 25px; }
    .breadcrumbs { font-size: 0.85rem; color: var(--muted); margin-bottom: 20px; }
    .breadcrumbs a { color: var(--primary); text-decoration: none; }
    h1 { font-size: 3.4rem; font-weight: 900; color: #fff; line-height: 1.2; margin-bottom: 25px; }
    .meta { font-size: 1rem; color: var(--muted); margin-bottom: 40px; display: flex; gap: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; flex-wrap: wrap; }
    .article-content { font-size: 1.3rem; color: #e6edf5; }
    h2 { color: var(--primary); font-size: 2.35rem; margin: 50px 0 25px; border-right: 6px solid var(--primary); padding-right: 20px; font-weight: 900; }
    h3 { color: #fff; font-size: 1.75rem; margin: 35px 0 15px; font-weight: 800; }
    p { margin-bottom: 38px; text-align: justify; }
    ul { margin-bottom: 38px; padding-right: 25px; }
    li { margin-bottom: 16px; }
    .stat-highlight, .opportunity, .lead-box { /* ... نفس الستايل السابق ... */ }
    /* (الستايل كامل زي ما هو، مش هطوله هنا عشان الرد ما يطولش) */
  </style>
</head>
<body>
  <!-- باقي الكود كامل (Header + Article + Footer) كما هو تماماً -->

  <!-- صندوق التحميل المحدث (الجزء المهم) -->
  <section class="lead-box" id="lead-section">
    <h3 style="color: #fff; margin-bottom: 5px;">حمّلي الكتالوج الحصري مجاناً 📥</h3>
    <div class="free-badge">Social Media SEO 2026</div>
    <p style="color: #fff; font-size: 1.4rem; font-weight: 700; margin-bottom: 30px; line-height: 1.5;">
      كتالوج <strong>Social Media SEO 2026</strong> — الدليل المتكامل لتحويل منصات السوشيال ميديا إلى محركات بحث قوية
    </p>
    
    <div style="max-width: 500px; margin: 0 auto;" id="form-container">
      <input type="text" id="name" placeholder="اسمك الكريم.." class="form-input" required>
      <input type="email" id="email" placeholder="بريدك الإلكتروني.." class="form-input" required>
      <input type="tel" id="whatsapp" placeholder="رقم الواتساب (لإرسال الملف).." class="form-input" required>
      <button onclick="handleLead()" id="submit-btn" class="submit-btn">أرسل لي الكتالوج فوراً 🚀</button>
      <div id="status" style="margin-top: 15px; font-weight: bold;"></div>
    </div>

    <div class="success-area" id="download-area">
      <div style="font-size: 50px; margin-bottom: 15px;">✅</div>
      <h3 style="color: #4ade80; margin-bottom: 10px; font-size: 1.8rem;">تم تسجيل بياناتك بنجاح!</h3>
      <p style="margin-bottom: 20px; font-size: 1.1rem; color: #e2e8f0;">جاري تحميل <strong>كتالوج Social Media SEO 2026</strong> فوراً..<br>اضغطي بالأسفل إذا لم يبدأ التحميل.</p>
      <a id="direct-download" href="#" class="submit-btn" style="background:#4ade80; color:#0f172a; text-decoration:none; display:inline-block; max-width:320px;">
        تحميل الكتالوج يدوياً 📂
      </a>
    </div>
  </section>

  <script>
    async function handleLead() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const wa = document.getElementById('whatsapp').value.trim();
      const status = document.getElementById('status');
      const btn = document.getElementById('submit-btn');

      if (!name || !email || !wa) {
        status.innerText = "من فضلك كملي البيانات الأول! ⚠️";
        status.style.color = "#f87171";
        return;
      }

      try {
        btn.disabled = true; 
        btn.innerText = "جاري تحضير الكتالوج...";

        const fd = new FormData();
        fd.append("entry.299023128", name);
        fd.append("entry.1712155557", email);
        fd.append("entry.1224669856", wa);
        fd.append("entry.334049848", "Social_Seo");   // ← مهم جداً

        await fetch("https://docs.google.com/forms/d/e/1FAIpQLSdSXEvN7DMMC-pwXED9G5TRpe4ecQ5U7pMtsg3201d2ikinfQ/formResponse", 
          { method: "POST", mode: "no-cors", body: fd });

        document.getElementById('form-container').style.display = 'none';
        document.getElementById('download-area').style.display = 'block';

        const fileId = "19qK1TzDfmGI2QfCsYaExE94fmdUbW1Ap";   // ← الملف الجديد Social Media SEO
        const downloadUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

        document.getElementById('direct-download').href = downloadUrl;

        const autoLink = document.createElement('a');
        autoLink.href = downloadUrl;
        autoLink.click();
      } catch (e) {
        status.innerText = "حدث خطأ بسيط.. حاولي مرة تانية.";
        status.style.color = "#f87171";
        btn.disabled = false;
        btn.innerText = "أرسل لي الكتالوج فوراً 🚀";
      }
    }
  </script>
</body>
</html>
