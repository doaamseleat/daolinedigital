<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المكتبة الذكية | Daoline Digital</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #c013a6;
      --primary-hover: #9a0e85;
      --bg: #07080c;
      --card: #0f1220;
      --text: #f3f4f6;
      --muted: rgba(243,244,246,0.65);
      --border: rgba(255,255,255,0.08);
      --radius: 24px;
    }

    * { box-sizing: border-box; outline: none; }
    body {
      margin: 0;
      font-family: "Tajawal", sans-serif;
      color: var(--text);
      background: radial-gradient(circle at 15% 15%, rgba(192,19,166,0.18), transparent 45%), var(--bg);
      line-height: 1.6;
      overflow-x: hidden;
    }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 0 24px; }

    /* --- Topbar --- */
    .topbar {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(7, 8, 12, 0.75);
      border-bottom: 1px solid var(--border);
    }
    .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
    .brand { font-weight: 900; font-size: 1.4rem; text-decoration: none; color: #fff; }
    .brand span { color: var(--primary); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 10px 24px; border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      font-weight: 800; font-size: 14px;
      text-decoration: none; color: white; transition: 0.3s;
    }
    .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .btn.primary { background: var(--primary); border: none; box-shadow: 0 10px 25px rgba(192, 19, 166, 0.3); }

    header { padding: 80px 0 40px; text-align: center; }
    h1 { font-size: clamp(2.5rem, 8vw, 3.5rem); font-weight: 900; margin-bottom: 15px; }
    .lead { font-size: 1.2rem; color: var(--muted); max-width: 700px; margin: 0 auto; }

    .section-title { font-size: 1.8rem; font-weight: 900; margin: 50px 0 30px; display: flex; align-items: center; gap: 15px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* --- Articles List --- */
    .list { display: grid; gap: 25px; margin-bottom: 80px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 35px;
      transition: 0.4s ease;
    }
    .card:hover { border-color: var(--primary); transform: translateY(-5px); box-shadow: 0 20px 40px rgba(0,0,0,0.4); }

    .new-badge {
      background: var(--primary); color: white; padding: 5px 15px; border-radius: 10px;
      font-size: 12px; font-weight: 900; display: inline-block; margin-bottom: 15px;
    }

    .card h2 { margin: 0 0 12px; font-size: 1.7rem; font-weight: 800; }
    .card h2 a { color: var(--text); text-decoration: none; transition: 0.3s; }
    .card h2 a:hover { color: var(--primary); }
    
    .desc { color: var(--muted); font-size: 1.05rem; margin-bottom: 25px; }

    .loader { text-align: center; padding: 100px 0; }
    .spinner {
      width: 40px; height: 40px; border: 3px solid rgba(192,19,166,0.1);
      border-left-color: var(--primary); border-radius: 50%;
      margin: 0 auto 15px; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { padding: 60px 0; text-align: center; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="wrap">
      <div class="nav">
        <a href="https://daolinedigital.com/" class="brand">Daoline <span>Digital</span></a>
        <a class="btn" href="https://daolinedigital.com/">الرئيسية</a>
      </div>
    </div>
  </div>

  <header class="wrap">
    <h1>المكتبة الذكية</h1>
    <p class="lead">وجهتك الأولى لاحتراف السوشيال ميديا في 2026 مع Daoline Digital.</p>
  </header>

  <main class="wrap">
    <div class="section-title">أحدث الإصدارات</div>
    <div id="articlesList" class="list">
        <div class="loader"><div class="spinner"></div><p>جاري ترتيب المقالات حسب الأحدث...</p></div>
    </div>
  </main>

  <footer>&copy; <span id="year"></span> Daoline Digital - جميع الحقوق محفوظة</footer>

  <script>
    const CONFIG = { owner: "doaamseleat", repo: "daolinedigital", path: "blog" };

    async function getArticles() {
      const url = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}?t=${Date.now()}`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        
        // --- تعديل الترتيب الذكي ---
        return data
          .filter(f => f.name.endsWith('.html') && f.name !== 'index.html')
          .sort((a, b) => {
            // استخراج الأرقام من بداية اسم الملف (مثل 017)
            const numA = parseInt(a.name.match(/^\d+/) || 0);
            const numB = parseInt(b.name.match(/^\d+/) || 0);
            return numB - numA; // ترتيب تنازلي (الأكبر فوق)
          });
      } catch (e) { return []; }
    }

    async function fetchInfo(file) {
      try {
        const res = await fetch(file.download_url);
        const html = await res.text();
        const doc = new DOMParser().parseFromString(html, 'text/html');
        return {
          title: doc.querySelector('title')?.innerText.split('|')[0].trim() || "مقال جديد",
          desc: doc.querySelector('meta[name="description"]')?.getAttribute('content') || "اكتشف أحدث دروس داولاين ديجيتال.",
          url: `/blog/${file.name}`
        };
      } catch (e) { return null; }
    }

    async function init() {
      const list = document.getElementById('articlesList');
      const files = await getArticles();
      
      if (files.length === 0) {
        list.innerHTML = '<p style="text-align:center; padding:40px;">لا توجد مقالات حالياً.</p>';
        return;
      }

      list.innerHTML = ''; // مسح اللودر

      for (let i = 0; i < files.length; i++) {
        const info = await fetchInfo(files[i]);
        if (!info) continue;

        const card = document.createElement('div');
        card.className = 'card';
        
        // بادج "صدر حديثاً" لأول مقال في القائمة المرتبة
        const badge = i === 0 ? `<div class="new-badge">صدر حديثاً 🔥</div>` : '';

        card.innerHTML = `
          ${badge}
          <h2><a href="${info.url}">${info.title}</a></h2>
          <p class="desc">${info.desc}</p>
          <a href="${info.url}" class="btn primary">استعرض المحتوى 🚀</a>
        `;
        list.appendChild(card);
      }
    }

    window.onload = () => {
      document.getElementById("year").textContent = new Date().getFullYear();
      init();
    };
  </script>
</body>
</html>
