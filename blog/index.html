<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المكتبة التلقائية | Daoline Digital</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #c013a6;
      --bg: #07080c;
      --bg2: #0b0d14;
      --card: #0f1220;
      --text: #f3f4f6;
      --muted: rgba(243,244,246,0.6);
      --border: rgba(255,255,255,0.08);
      --shadow: 0 15px 45px rgba(0,0,0,0.5);
      --radius: 24px;
      --max: 1000px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Tajawal", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 10%, rgba(192,19,166,0.15), transparent 50%),
        radial-gradient(circle at 90% 20%, rgba(192,19,166,0.1), transparent 50%),
        var(--bg);
      line-height: 1.6;
    }

    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }

    .topbar {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(15px);
      background: rgba(7, 8, 12, 0.7);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 0;
    }
    .brand { font-weight: 900; font-size: 1.3rem; letter-spacing: -0.5px; }
    .brand span { color: var(--primary); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 12px 24px; border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.05);
      font-weight: 800; font-size: 14px;
      cursor: pointer; transition: 0.3s;
      text-decoration: none; color: white;
      gap: 8px;
    }
    .btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
    .btn.primary {
      background: linear-gradient(180deg, var(--primary), #9a0e85);
      border: none; box-shadow: 0 10px 25px rgba(192, 19, 166, 0.3);
    }

    header { padding: 80px 0 40px; text-align: center; }
    h1 { font-size: clamp(2.5rem, 8vw, 3.5rem); font-weight: 900; margin: 0 0 15px; letter-spacing: -1px; }
    .lead { font-size: 1.2rem; color: var(--muted); max-width: 700px; margin: 0 auto; line-height: 1.8; }
    .lead b { color: var(--text); border-bottom: 2px solid var(--primary); }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-bottom: 60px;
    }
    .f-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      padding: 30px;
      border-radius: var(--radius);
      text-align: center;
      transition: 0.3s;
    }
    .f-card:hover { background: rgba(192,19,166,0.05); border-color: var(--primary); }
    .f-icon { font-size: 2rem; margin-bottom: 15px; display: block; }
    .f-card h3 { margin: 0 0 10px; font-size: 1.2rem; font-weight: 800; }
    .f-card p { margin: 0; font-size: 0.9rem; color: var(--muted); }

    .section-title { font-size: 1.8rem; font-weight: 900; margin-bottom: 30px; display: flex; align-items: center; gap: 15px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .list { display: grid; gap: 25px; margin-bottom: 60px; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 35px;
      position: relative;
      transition: 0.4s ease;
      animation: slideUp 0.6s ease forwards;
      opacity: 0;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card:hover { border-color: rgba(192,19,166,0.4); transform: translateY(-5px); box-shadow: var(--shadow); }

    .tag-container { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
    .tag {
      background: rgba(192,19,166,0.1);
      border: 1px solid rgba(192,19,166,0.2);
      padding: 6px 14px; border-radius: 50px;
      font-size: 11px; font-weight: 800; color: #ff9ef4;
    }

    h2 { margin: 0 0 15px; font-size: 1.7rem; font-weight: 800; line-height: 1.4; }

    /* ✅ إصلاح لون الروابط (العناوين) */
    h2 a {
      color: var(--text);
      text-decoration: none;
    }
    h2 a:hover {
      color: #fff;
      text-decoration: underline;
      text-decoration-color: rgba(192,19,166,0.7);
      text-underline-offset: 6px;
    }

    .desc {
      color: var(--muted);
      font-size: 1.05rem;
      margin-bottom: 30px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .newsletter {
      background: linear-gradient(145deg, #161b33, #0f1220);
      border-radius: var(--radius);
      padding: 50px;
      text-align: center;
      margin-bottom: 80px;
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }
    .newsletter::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle, rgba(192,19,166,0.1) 0%, transparent 70%);
      pointer-events: none;
    }
    .newslet
