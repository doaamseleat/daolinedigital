<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المكتبة الذكية | Daoline Digital</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --primary:#c013a6;
      --bg:#07080c;
      --card:#0f1220;
      --text:#f3f4f6;
      --muted:rgba(243,244,246,.6);
      --border:rgba(255,255,255,.08);
      --radius:22px;
      --max:1000px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:"Tajawal",sans-serif;
      background:var(--bg);
      color:var(--text);
      line-height:1.7;
    }

    .wrap{
      max-width:var(--max);
      margin:auto;
      padding:0 20px;
    }

    header{
      text-align:center;
      padding:80px 0 40px;
    }

    h1{
      font-size:3rem;
      margin:0 0 10px;
      font-weight:900;
    }

    .lead{
      color:var(--muted);
    }

    .list{
      display:grid;
      gap:25px;
      margin:50px 0;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:35px;
      transition:.3s;
    }

    .card:hover{
      border-color:var(--primary);
      transform:translateY(-4px);
    }

    h2{
      margin:0 0 15px;
      font-size:1.6rem;
      font-weight:800;
    }

    h2 a{
      color:white;
      text-decoration:none;
    }

    h2 a:hover{
      text-decoration:underline;
      text-underline-offset:6px;
    }

    .desc{
      color:var(--muted);
      margin-bottom:20px;
    }

    .btn{
      display:inline-block;
      padding:10px 22px;
      border-radius:14px;
      background:linear-gradient(180deg,var(--primary),#9a0e85);
      color:white;
      text-decoration:none;
      font-weight:800;
      font-size:14px;
    }

    footer{
      text-align:center;
      padding:40px 0;
      border-top:1px solid var(--border);
      color:var(--muted);
      font-size:14px;
    }
  </style>
</head>

<body>

<header class="wrap">
  <h1>المكتبة الذكية</h1>
  <p class="lead">
    أي مقال جديد يظهر هنا تلقائيًا ✨
  </p>
</header>

<main class="wrap">
  <div id="articlesList" class="list">
    <p style="text-align:center;opacity:.6">جاري تحميل المقالات…</p>
  </div>
</main>

<footer>
  © <span id="year"></span> Daoline Digital
</footer>

<script>
  const CONFIG = {
    owner: "doaamseleat",
    repo: "daolinedigital",
    path: "blog"
  };

  const CACHE_BUST = Date.now();

  async function fetchNoCache(url){
    return fetch(url + "?v=" + CACHE_BUST, { cache:"no-store" });
  }

  async function getFiles(){
    const api = `https://api.github.com/repos/${CONFIG.owner}/${CONFIG.repo}/contents/${CONFIG.path}`;
    const res = await fetchNoCache(api);
    if(!res.ok) return [];
    const data = await res.json();
    return data.filter(f => f.name.endsWith(".html"));
  }

  async function getMeta(file){
    const url = `./blog/${file.name}`;
    const res = await fetchNoCache(url);
    if(!res.ok) return null;

    const html = await res.text();
    const doc = new DOMParser().parseFromString(html,"text/html");

    return {
      title: doc.querySelector("title")?.innerText.split("|")[0].trim()
              || file.name.replace(".html",""),
      desc: doc.querySelector('meta[name="description"]')?.content
            || "اضغط لقراءة المقال",
      url
    };
  }

  async function init(){
    const box = document.getElementById("articlesList");
    const files = await getFiles();

    if(!files.length){
      box.innerHTML="<p style='text-align:center;opacity:.6'>لا توجد مقالات حالياً</p>";
      return;
    }

    const metas = await Promise.all(files.map(getMeta));

    box.innerHTML="";

    metas.forEach(m=>{
      if(!m) return;
      box.innerHTML += `
        <div class="card">
          <h2><a href="${m.url}">${m.title}</a></h2>
          <p class="desc">${m.desc}</p>
          <a class="btn" href="${m.url}">اقرأ المقال</a>
        </div>
      `;
    });
  }

  document.getElementById("year").textContent = new Date().getFullYear();
  init();
</script>

</body>
</html>
