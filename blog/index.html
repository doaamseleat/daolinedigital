<style>

<body>

<div class="wrap">

<a href="https://daolinedigital.com/" class="home-btn">← العودة للرئيسية</a>

<h1>المكتبة المجانية لتعلم التسويق الرقمي</h1>

<p class="lead">
عايز تتعلم التسويق الرقمي من غير تعقيد؟  
هنا هتلاقي مقالات بسيطة تساعدك تفهم السوشيال ميديا والمحتوى خطوة خطوة.
</p>

<div class="value">
📚 مقالات عملية + أفكار محتوى + استراتيجيات قابلة للتطبيق
</div>

<div id="articles">
  <div class="loading">جاري تحميل المقالات...</div>
</div>

<footer>
© Daoline Digital
</footer>

</div>

<div class="float-widget hidden" id="float-widget">
  <div class="float-panel" id="float-panel">
    <button class="float-close" onclick="toggleFloat()">✕</button>

    <h4>🎓 سجّل في الكورس المجاني</h4>

    <input type="text" id="float-name" placeholder="اسمك" />
    <input type="email" id="float-email" placeholder="إيميلك" />
    <input type="tel" id="float-phone" placeholder="رقم الواتساب" />

    <button class="float-submit" onclick="submitFloatCourse()">
      تسجيل
    </button>
  </div>

  <button class="float-btn" onclick="toggleFloat()">
    🎓 سجّل في الكورس المجاني
  </button>
</div>

<script>
async function loadArticles() {
  const container = document.getElementById("articles");

  try {
    const res = await fetch("/blog/articles.json?v=" + Date.now());

    if (!res.ok) {
      throw new Error("articles.json not found");
    }

    const articles = await res.json();

    if (!Array.isArray(articles) || articles.length === 0) {
      container.innerHTML = `
        <div class="error-box">
          لا توجد مقالات متاحة حاليًا.
        </div>
      `;
      return;
    }

    container.innerHTML = "";

    articles.forEach(article => {
      const title = article.title || "مقال من Daoline Digital";
      const desc = article.desc || "مقال جديد من مكتبة Daoline Digital.";
      const link = article.link || "#";

      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h2>${escapeHTML(title)}</h2>
        <p class="desc">${escapeHTML(desc)}</p>
        <a href="/blog/${encodeURIComponent(link)}" class="btn">
          اقرأ المقال ←
        </a>
      `;

      container.appendChild(card);
    });

  } catch (error) {
    container.innerHTML = `
      <div class="error-box">
        <h2>في مشكلة في تحميل المقالات</h2>
        <p>
          تأكدي إن ملف
          <b>articles.json</b>
          اتولد داخل فولدر
          <b>blog</b>
          بعد تشغيل GitHub Action.
        </p>
      </div>
    `;

    console.error(error);
  }
}

function escapeHTML(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadArticles();

window.addEventListener("scroll", function () {
  const widget = document.getElementById("float-widget");

  if (widget) {
    window.scrollY > 350
      ? widget.classList.remove("hidden")
      : widget.classList.add("hidden");
  }
});

function toggleFloat() {
  const panel = document.getElementById("float-panel");

  if (panel) {
    panel.classList.toggle("open");
  }
}

const COURSE_WEB_APP_URL =
"https://script.google.com/macros/s/AKfycbzFcWGX7Qw1EFS2Z1cq6gl7RIvkI3Ot-7a2-jHMxpgfz4f9im3hyDH165iZHYtXrbV2/exec";

function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

function normalizePhone(phone) {
  return String(phone || "")
    .replace(/[\s\-()]/g, "")
    .trim();
}

function isValidPhone(phone) {
  const normalized = normalizePhone(phone);

  return /^(\+?\d{10,15}|01\d{9})$/.test(normalized);
}

function submitFloatCourse() {
  const btn = document.querySelector(".float-submit");

  const name =
    document.getElementById("float-name").value.trim();

  const email =
    document.getElementById("float-email").value.trim();

  const phone =
    document.getElementById("float-phone").value.trim();

  if (!name || !email || !phone) {
    alert("من فضلك اكتب الاسم والإيميل ورقم الواتساب");
    return;
  }

  if (!isValidEmail(email)) {
    alert("من فضلك اكتب إيميل صحيح");
    return;
  }

  if (!isValidPhone(phone)) {
    alert("من فضلك اكتب رقم واتساب صحيح");
    return;
  }

  btn.disabled = true;
  btn.textContent = "جاري التسجيل...";

  const payload = new URLSearchParams();

  payload.append("name", name);
  payload.append("email", email);
  payload.append("phone", normalizePhone(phone));
  payload.append("source", "blog-index-floating-widget");
  payload.append("page", window.location.href);

  fetch(COURSE_WEB_APP_URL, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type":
      "application/x-www-form-urlencoded;charset=UTF-8"
    },
    body: payload.toString()
  })

  .then(() => {

    if (typeof gtag === "function") {
      gtag("event", "generate_lead", {
        event_category: "lead",
        event_label: "blog-index-floating-widget"
      });
    }

    const panel =
      document.getElementById("float-panel");

    panel.innerHTML = `
      <p style="color:#86efac;text-align:center;line-height:1.8;margin:0;">
        ✅ تم تسجيلك بنجاح!
      </p>
    `;
  })

  .catch(() => {
    alert("حصلت مشكلة في التسجيل. جرب مرة تانية.");

    btn.disabled = false;
    btn.textContent = "تسجيل";
  });
}
</script>

</body>
