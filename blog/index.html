<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>المكتبة المجانية لتعلم التسويق الرقمي 2026 | Daoline Digital</title>
<meta name="description" content="عايز تتعلم التسويق الرقمي؟ هنا هتلاقي مقالات بسيطة وسهلة عن السوشيال ميديا والمحتوى والإعلانات خطوة خطوة." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://daolinedigital.com/blog/" />

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: "Tajawal", sans-serif;
  background: #07080c;
  color: #fff;
}

.wrap {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.home-btn {
  display: inline-flex;
  padding: 10px 18px;
  border-radius: 14px;
  border: 1px solid rgba(255,255,255,0.08);
  background: rgba(255,255,255,0.05);
  color: #fff;
  text-decoration: none;
  font-weight: 800;
  margin-bottom: 30px;
}

.home-btn:hover {
  background: rgba(255,255,255,0.1);
}

h1 {
  text-align: center;
  font-size: 2.4rem;
  margin-bottom: 10px;
}

.lead {
  text-align: center;
  color: #aaa;
  line-height: 1.8;
}

.value {
  text-align: center;
  margin-top: 10px;
  font-size: 14px;
  color: #888;
  margin-bottom: 35px;
}

.loading {
  text-align: center;
  color: #bbb;
  background: #0f1220;
  padding: 25px;
  border-radius: 18px;
  border: 1px solid rgba(255,255,255,0.08);
}

.card {
  background: #0f1220;
  padding: 25px;
  margin: 20px 0;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.08);
  transition: 0.3s;
}

.card:hover {
  border-color: #c013a6;
  transform: translateY(-5px);
}

.card h2 {
  margin: 0 0 10px;
  font-size: 1.45rem;
  line-height: 1.5;
}

.desc {
  color: #bbb;
  margin-bottom: 15px;
  line-height: 1.8;
}

.btn {
  display: inline-block;
  padding: 10px 16px;
  background: #c013a6;
  border-radius: 10px;
  color: #fff;
  text-decoration: none;
  font-weight: bold;
}

.btn:hover {
  background: #9a0e85;
}

.error-box {
  background: #1a0f16;
  border: 1px solid rgba(192,19,166,0.45);
  padding: 25px;
  border-radius: 20px;
  color: #fff;
  text-align: center;
  line-height: 1.8;
}

footer {
  text-align: center;
  margin-top: 60px;
  color: #777;
}

@media (max-width: 600px) {
  h1 {
    font-size: 1.9rem;
    line-height: 1.5;
  }

  .wrap {
    padding: 16px;
  }

  .card {
    padding: 20px;
  }

  .card h2 {
    font-size: 1.2rem;
  }
}
</style>
</head>

<body>

<div class="wrap">

<a href="https://daolinedigital.com/" class="home-btn">← العودة للرئيسية</a>

<h1>المكتبة المجانية لتعلم التسويق الرقمي</h1>

<p class="lead">
عايز تتعلم التسويق الرقمي من غير تعقيد؟  
هنا هتلاقي مقالات بسيطة تساعدك تفهم السوشيال ميديا والمحتوى خطوة خطوة.
</p>

<div class="value">
📚 مقالات عملية + أفكار محتوى + استراتيجيات قابلة للتطبيق
</div>

<div id="articles">
  <div class="loading">جاري تحميل المقالات...</div>
</div>

<footer>
© Daoline Digital
</footer>

</div>

<script>
async function loadArticles() {
  const container = document.getElementById("articles");

  try {
    const res = await fetch("/blog/articles.json?v=" + Date.now());

    if (!res.ok) {
      throw new Error("لم يتم العثور على ملف articles.json");
    }

    const articles = await res.json();

    if (!Array.isArray(articles) || articles.length === 0) {
      container.innerHTML = `
        <div class="error-box">
          لا توجد مقالات متاحة حاليًا.
        </div>
      `;
      return;
    }

    container.innerHTML = "";

    articles.forEach(article => {
      const card = document.createElement("div");
      card.className = "card";

      card.innerHTML = `
        <h2>${escapeHTML(article.title)}</h2>
        <p class="desc">${escapeHTML(article.desc)}</p>
        <a href="/blog/${encodeURIComponent(article.link)}" class="btn">اقرأ المقال ←</a>
      `;

      container.appendChild(card);
    });

  } catch (error) {
    container.innerHTML = `
      <div class="error-box">
        <h2>في مشكلة في تحميل المقالات</h2>
        <p>تأكدي إن ملف <b>articles.json</b> موجود داخل فولدر <b>blog</b>.</p>
      </div>
    `;
    console.error(error);
  }
}

function escapeHTML(str) {
  return String(str || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

loadArticles();
</script>

</body>
</html>
