<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- SEO -->
  <title>المكتبة المجانية لتعلم التسويق الرقمي 2026 | مقالات سوشيال ميديا | Daoline Digital</title>
  <meta name="description" content="عايز تتعلم التسويق الرقمي؟ هنا هتلاقي مقالات بسيطة وسهلة عن السوشيال ميديا، المحتوى، والإعلانات، خطوة خطوة وبشكل عملي." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://daolinedigital.com/blog/" />

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: "Tajawal", sans-serif;
      background: #07080c;
      color: #f3f4f6;
    }

    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 60px 0 30px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .lead {
      color: #aaa;
      font-size: 1.1rem;
      line-height: 1.8;
    }

    .value {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
    }

    .card {
      background: #0f1220;
      padding: 25px;
      margin: 20px 0;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      transition: 0.3s;
    }

    .card:hover {
      border-color: #c013a6;
      transform: translateY(-5px);
    }

    .card h2 {
      margin: 0 0 10px;
    }

    .desc {
      color: #bbb;
      margin-bottom: 15px;
    }

    .btn {
      display: inline-block;
      padding: 10px 18px;
      background: #c013a6;
      border-radius: 12px;
      color: #fff;
      text-decoration: none;
      font-weight: bold;
    }

    .btn:hover {
      background: #9a0e85;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      color: #777;
    }
  </style>
</head>

<body>

<div class="wrap">

<header>
  <h1>المكتبة المجانية لتعلم التسويق الرقمي</h1>

  <p class="lead">
    عايز تتعلم التسويق الرقمي من غير تعقيد؟  
    هنا هتلاقي مقالات بسيطة تساعدك تفهم السوشيال ميديا والمحتوى خطوة خطوة.
  </p>

  <div class="value">
    📚 مقالات عملية + أفكار محتوى + استراتيجيات قابلة للتطبيق
  </div>
</header>

<div id="articles"></div>

<footer>
  © Daoline Digital
</footer>

</div>

<script>
async function loadArticles() {
  const res = await fetch("https://api.github.com/repos/doaamseleat/daolinedigital/contents/blog");
  const data = await res.json();

  const articles = data
    .filter(f => f.name.endsWith(".html") && f.name !== "index.html")
    .sort((a,b)=>{
      let n1 = parseInt(a.name);
      let n2 = parseInt(b.name);
      return n2 - n1;
    });

  const container = document.getElementById("articles");

  for (let file of articles) {
    let html = await fetch(file.download_url).then(r=>r.text());
    let doc = new DOMParser().parseFromString(html,"text/html");

    let title = doc.querySelector("title")?.innerText || "مقال جديد";
    let desc = doc.querySelector('meta[name="description"]')?.content || "اقرأ المقال";

    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <h2>${title}</h2>
      <p class="desc">${desc}</p>
      <a href="/blog/${file.name}" class="btn">اقرأ المقال ←</a>
    `;

    container.appendChild(card);
  }
}

loadArticles();
</script>

</body>
</html>
