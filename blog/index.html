<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>المكتبة المجانية لتعلم التسويق الرقمي 2026 | Daoline Digital</title>
<meta name="description" content="عايز تتعلم التسويق الرقمي؟ هنا هتلاقي مقالات بسيطة وسهلة عن السوشيال ميديا والمحتوى والإعلانات خطوة خطوة." />
<meta name="robots" content="index, follow" />
<link rel="canonical" href="https://daolinedigital.com/blog/" />

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;700;900&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:"Tajawal",sans-serif;
  background:#07080c;
  color:#fff;
}

.wrap {
  max-width:900px;
  margin:auto;
  padding:20px;
}

h1 {
  text-align:center;
  font-size:2.4rem;
  margin-top:40px;
}

.lead {
  text-align:center;
  color:#aaa;
  line-height:1.8;
}

.card {
  background:#0f1220;
  padding:25px;
  margin:20px 0;
  border-radius:20px;
  border:1px solid rgba(255,255,255,0.08);
}

.card h2 {
  margin:0 0 10px;
}

.desc {
  color:#bbb;
  margin-bottom:15px;
}

.btn {
  display:inline-block;
  padding:10px 16px;
  background:#c013a6;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">

<h1>المكتبة المجانية لتعلم التسويق الرقمي</h1>

<p class="lead">
عايز تتعلم التسويق الرقمي من غير تعقيد؟  
هنا هتلاقي مقالات بسيطة تساعدك تفهم السوشيال ميديا والمحتوى خطوة خطوة.
</p>

<div id="articles"></div>

</div>

<script>
async function loadArticles(){
  const res = await fetch("https://api.github.com/repos/doaamseleat/daolinedigital/contents/blog");
  const data = await res.json();

  const articles = data
    .filter(f => f.name.endsWith(".html") && f.name !== "index.html")
    .sort((a,b)=>parseInt(b.name)-parseInt(a.name));

  const container = document.getElementById("articles");

  for(let file of articles){
    let html = await fetch(file.download_url).then(r=>r.text());
    let doc = new DOMParser().parseFromString(html,"text/html");

    let title = doc.querySelector("title")?.innerText || "مقال";
    let desc = doc.querySelector('meta[name="description"]')?.content || "";

    let card = document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <h2>${title}</h2>
      <p class="desc">${desc}</p>
      <a href="/blog/${file.name}" class="btn">اقرأ المقال ←</a>
    `;

    container.appendChild(card);
  }
}

loadArticles();
</script>

</body>
</html>
