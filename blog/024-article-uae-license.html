<script>
  async function handleLead() {
    const name   = document.getElementById('name').value.trim();
    const email  = document.getElementById('email').value.trim();
    const wa     = document.getElementById('whatsapp').value.trim();
    const status = document.getElementById('status');
    const btn    = document.getElementById('submit-btn');

    if (!name || !email || !wa) {
      status.innerText = "من فضلك كملي البيانات الأول! ⚠️";
      status.style.color = "#f87171";
      return;
    }

    btn.disabled = true;
    btn.innerText = "جاري الإرسال...";

    try {
      const fd = new FormData();
      fd.append("entry.299023128",  name);
      fd.append("entry.1712155557", email);
      fd.append("entry.1224669856", wa);
      fd.append("entry.334049848",  "Social_Seo");

      await fetch(
        "https://docs.google.com/forms/d/e/1FAIpQLSdSXEvN7DMMC-pwXED9G5TRpe4ecQ5U7pMtsg3201d2ikinfQ/formResponse",
        { method: "POST", mode: "no-cors", body: fd }
      );

      btn.innerText = "تم الإرسال ✅";
      status.innerHTML = `
        <span style="color:#4ade80; font-size:1.1rem;">✅ تم بنجاح!</span><br>
        <span style="color:#a8b8cc; font-size:0.95rem;">شيك على إيميلك — الدليل وصلك هناك مباشرة.<br>لو ما لقيتيش الإيميل، دوري في الـ Spam.</span>
      `;

      document.getElementById('name').value = "";
      document.getElementById('email').value = "";
      document.getElementById('whatsapp').value = "";

    } catch (e) {
      status.innerText = "حدث خطأ بسيط.. حاولي مرة تانية.";
      status.style.color = "#f87171";
      btn.disabled = false;
      btn.innerText = "أرسل لي الدليل المجاني الآن 🚀";
    }
  }
</script>
